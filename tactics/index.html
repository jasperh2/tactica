<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <title>TACTICA — Conqueror's Blade tactics playbook</title>
  <link rel="stylesheet" href="./styles/tokens.css" />
  <link rel="stylesheet" href="../shared/academy.css" />
  <link rel="stylesheet" href="./styles/app.css" />
</head>
<body>
  <div id="app-shell">
    <div id="nav-root" role="navigation"></div>
    <div id="topbar" role="banner"></div>
    <div id="middle">
      <div id="layers" role="complementary" aria-label="Layers"></div>
      <div id="canvas" role="main" aria-label="Map canvas"></div>
      <div id="dock" role="complementary" aria-label="Tools and options">
        <div id="toolrail" role="toolbar" aria-label="Tools"></div>
        <div id="dock-options" data-dock-region="options">
          <div id="inspector" aria-label="Inspector"></div>
        </div>
      </div>
    </div>
    <div id="playbookbar" role="region" aria-label="Playbook"></div>
  </div>
  <div id="modal-root"></div>
  <div id="gate-root"></div>

  <script type="module">
    // Cosmetic testing-build password gate (see ui/gate.mjs threat model). Mounts an overlay that
    // covers the app until unlocked; app.mjs below keeps booting normally underneath.
    import { mountGate } from './ui/gate.mjs';
    mountGate(document.getElementById('gate-root'));
  </script>
  <script type="module">
    // Shared Academy nav strip (docs/specs/academy-site-architecture.md: "tactics/ FROZEN except:
    // nav strip include + gate include"). Imported from ../shared/ rather than copied, same as
    // any other page — nav.mjs resolves its own hrefs off import.meta.url so this works
    // regardless of deploy subpath (see shared/nav.mjs PATH RESOLUTION note).
    import { mountNav } from '../shared/nav.mjs';
    mountNav('tactics');
  </script>
  <script type="module" src="./ui/app.mjs"></script>
</body>
</html>
